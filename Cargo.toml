[package]
name = "tiny-proxy"
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
description = "Personal native desktop model gateway"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:raw-window-handle"]

[dependencies]
anyhow = "1"
axum = "0.8.9"
base64 = "0.22"
chrono = "0.4.45"
fs2 = "0.4"
futures-util = "0.3"
gpui-kit = { version = "=0.7.3", optional = true }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
security-framework = "3.7"

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3"
rsa = "0.9"
rand08 = { package = "rand", version = "0.8" }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[[example]]
name = "desktop_probe"
required-features = ["desktop"]

[[bin]]
name = "tiny-proxy"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 1

[lints.clippy]
dbg_macro = "deny"
