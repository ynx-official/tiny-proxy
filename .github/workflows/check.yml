name: Native checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Validate release metadata and tooling
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_notes.py --check-current
          python -m unittest scripts/test_release_notes.py scripts/test_update_manifest.py scripts/test_release_contract.py scripts/test_macos_packaging.py
      - name: Use a temporary keychain for macOS credential tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          TEST_KEYCHAIN="$RUNNER_TEMP/tiny-proxy-ci.keychain-db"
          TEST_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$TEST_PASSWORD"
          security create-keychain -p "$TEST_PASSWORD" "$TEST_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$TEST_KEYCHAIN"
          security unlock-keychain -p "$TEST_PASSWORD" "$TEST_KEYCHAIN"
          security default-keychain -d user -s "$TEST_KEYCHAIN"
          security list-keychains -d user -s "$TEST_KEYCHAIN"
          # Integration tests run in multiple separate Rust executables. Give
          # only this disposable test keychain's synthetic encryption key an
          # all-app ACL, avoiding unattended permission prompts between them.
          TEST_DATA_KEY="$(openssl rand -hex 16)"
          echo "::add-mask::$TEST_DATA_KEY"
          security add-generic-password -A -s dev.tiny-proxy.credentials -a local-aes-256-gcm-v1 -w "$TEST_DATA_KEY" "$TEST_KEYCHAIN"
      - run: cargo +1.96.0 fmt --all -- --check
      - run: cargo +1.96.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.96.0 test --all-targets --locked
        timeout-minutes: 15
      - run: cargo +1.96.0 build --release --locked --target ${{ matrix.target }} --bin tiny-proxy
