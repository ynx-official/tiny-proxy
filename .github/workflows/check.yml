name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.96.0 fmt --all -- --check
      - run: cargo +1.96.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.96.0 test --all-targets --locked
      - run: cargo +1.96.0 build --release --locked
